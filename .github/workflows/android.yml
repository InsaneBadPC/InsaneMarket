name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "90961BE18E9C1575B5DEF00C9CB50E154EA8EABC45338F499661070730FC0463"
  VERSION_NAME: "0.3.${{ github.run_number }}"
  VERSION_CODE: "${{ github.run_number }}"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}" -path '*cmdline-tools/*/bin/sdkmanager' | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Prepare signing key
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/insanemarket.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Require signing on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "::error::Chybí ANDROID_KEYSTORE_BASE64. Bez stabilního klíče by se každá verze podepsala jinak a nešla nainstalovat přes předchozí. Nastav signing secrets podle README."
          exit 1

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify signing certificate
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::APK není podepsané očekávaným klíčem. Nová verze by nešla nainstalovat přes předchozí."
            exit 1
          fi

      - name: Generate market metadata
        shell: bash
        run: |
          cat > insanemarket.json <<'JSON'
          {
            "displayName": "InsaneMarket",
            "packageName": "cz.insanebadpc.insanemarket",
            "description": "Katalog mých aplikací z GitHubu s instalací a aktualizacemi."
          }
          JSON

      - name: Upload signed APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: InsaneMarket-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            insanemarket.json
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.VERSION_NAME }}
          name: InsaneMarket ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            insanemarket.json
